<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Material detail</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="chrome"></div>
<main class="content" id="material-body">
  <div class="context-bar" id="material-context"></div>
  <div class="page-header"><div><h1 id="material-title">Material</h1><div class="page-subtitle" id="material-subtitle"></div></div>
    <button class="btn btn-ghost" id="material-edit-btn">Edit material</button></div>
  <div class="info-panel"><div class="info-grid" id="material-info"></div></div>
  <div class="section-label">Connections</div>
  <div class="chip-links" id="material-connections"></div>
  <div class="section-label">Welds on this material</div>
  <div class="table-card"><table class="table-wide"><thead><tr><th>Weld No.</th><th>Between</th><th>Type</th><th>Proc.</th><th>Welding Wire</th><th>Welder</th><th>Inspector</th><th>Date</th><th>Endo. Video</th><th>Endo. Image</th><th>Remarks</th><th></th></tr></thead><tbody id="material-welds-tbody"></tbody></table></div>
</main>
<div id="modal-root"></div>
<script src="app.js"></script><script>initMaterialDetailPage();</script>
</body></html>
